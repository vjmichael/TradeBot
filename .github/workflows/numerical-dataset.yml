name: TB-06A numerical dataset native acceptance
on:
  push:
    paths:
      - 'numerical_features.py'
      - 'numerical_dataset.py'
      - 'scripts/manage_numerical.py'
      - 'scripts/qualify_numerical.py'
      - 'tests/test_numerical*.py'
      - 'market_memory.py'
      - 'market_lake.py'
      - 'vintage_memory.py'
      - 'data_lifecycle.py'
      - 'requirements-market.txt'
      - '.github/workflows/numerical-dataset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-market.txt
      - run: python -m unittest discover -s tests -p 'test_numerical*.py' -v
      - run: python scripts/qualify_numerical.py
