name: R2B exact-source protected vault and offline status qualification
on:
  push:
    branches: [qualification/tb-sec-key-01-r2a-r1-d1]
    paths:
      - .github/workflows/r2b-exact-source.yml
permissions:
  contents: read
jobs:
  locked-r2b-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Restore exact D2 base then exact isolated R2B overlay
        run: |
          set -euo pipefail
          mkdir -p receipt
          bash qualification/r2b-integrate-02-r2-r1/restore-r2b.sh "$RUNNER_TEMP/maj-r2b" | tee receipt/source-lock.txt
      - name: Install isolated pinned Python test requirements
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check cryptography==46.0.4 pydantic==2.13.5 fastapi==0.128.2 httpx==0.28.1
      - name: Actual restored PaperVault and health unit acceptance
        run: |
          set -euo pipefail
          TESTS="$GITHUB_WORKSPACE/qualification/r2b-integrate-02-r2-r1/tests"
          cd "$RUNNER_TEMP/maj-r2b"
          export PYTHONPATH="$PWD:$TESTS"
          python -m compileall -q paper_credential_vault.py managed_paper_vault.py managed_rpc.py vault_owner_hooks.py health_backend.py health_cache.py health_endpoint.py offline_health.py tradebot.py
          python -m unittest discover -s "$TESTS" -p 'test_*.py' -v 2>&1 | tee "$GITHUB_WORKSPACE/receipt/units.txt"
      - name: Real dashboard source parse and pinned React build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/maj-r2b"
          node --check dashboard/app.js
          node tests/account_connections_render.cjs
          cd dashboard
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test "$(git hash-object package-lock.json)" = 2e72c5a32098c7d503b2bf0e35fac28b607a02d7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2b-source-qualification-receipt
          path: receipt/
          if-no-files-found: warn
          retention-days: 7
