name: R2A R3 installed session lock switch logout and credential recovery
on:
  push:
    branches: [qualification/tb-sec-key-01-r2a-native-r3]
    paths: ['.github/workflows/r2a-native-r3.yml']
permissions:
  contents: read
jobs:
  installed-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lock unchanged R1 R2 production and independent R3 harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          bash qualification/r2b-integrate-02-r2-r3/restore-r3.sh "$RUNNER_TEMP/r2b-r3" | tee receipt/source-tree.txt
          test "$(git -C "$RUNNER_TEMP/r2b-r3" hash-object credential_handoff.py)" = 269bdc0b19d8a189496c7ca3b9369c158f85b0f6
          test "$(git hash-object qualification/r2a-native-r3/harness.py)" = 15f7f33d28c9ecbbfe0c49e45efd70189893615e
          test "$(git hash-object qualification/r2a-native-negative/test_handoff_refusals.py)" = d2fc1b43c6db299947f2aac999c86d6e230fd566
          git rev-parse HEAD | tee receipt/acceptance-commit.txt
          cd "$RUNNER_TEMP/r2b-r3/dashboard"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test "$(git hash-object package-lock.json)" = 2e72c5a32098c7d503b2bf0e35fac28b607a02d7
      - name: Compile and qualify exact-source native handoff and refusals
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/r2b-r3/requirements.txt"
          export PYTHONPATH="$RUNNER_TEMP/r2b-r3:$GITHUB_WORKSPACE/qualification/r2b-integrate-02-r2-r3/tests:$GITHUB_WORKSPACE/qualification/r2a-native-negative"
          python -m compileall -q "$RUNNER_TEMP/r2b-r3/credential_handoff.py" qualification/r2a-native-r3/harness.py
          python -m unittest discover -s "$RUNNER_TEMP/r2b-r3/tests" -p test_credential_handoff.py -v 2>&1 | tee receipt/original-handoff-tests.txt
          python -m unittest -v test_credential_intent test_handoff_refusals 2>&1 | tee receipt/refusal-tests.txt
      - name: Install native offline VM prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap debian-archive-keyring qemu-system-x86 qemu-utils e2fsprogs python3-pexpect imagemagick
      - name: Build genuine installed offline Debian 13
        shell: bash
        run: |
          set -euo pipefail
          sudo bash qualification/d2/build.sh "$RUNNER_TEMP/r2b-r3" "$RUNNER_TEMP/r2b-root" "$GITHUB_WORKSPACE/qualification/r2b-integrate-02-r2-r2/native" "$RUNNER_TEMP/r2b-vm"
          cp "$RUNNER_TEMP/r2b-vm/"{packages,dpkg-audit}.txt receipt/
      - name: Actual native lock seat logout unsaved credential and restart qualification
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 qualification/r2a-native-r3/harness.py "$RUNNER_TEMP/r2b-vm" "$GITHUB_WORKSPACE/receipt" | tee receipt/r3-native.txt
          for marker in R3_INSTALLED_LOCK_REFUSAL_PASS R3_INSTALLED_SEAT_SWITCH_PASS R3_INSTALLED_LOGOUT_REFUSAL_PASS R3_INSTALLED_UNSAVED_EXIT_PASS R3_INSTALLED_UNSAVED_LOGOUT_PASS R3_INSTALLED_PERSISTENCE_RESTART_PASS R3_INSTALLED_GUI_REMOVAL_PASS R3_NATIVE_INSTALLED_PASS; do
            grep -Fx "$marker" receipt/r3-native.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2a-native-r3-installed-receipts
          path: receipt/
          retention-days: 5
