name: R2B native unmodified operator GUI logind session attestation
on:
  push:
    branches: [qualification/tb-sec-key-01-r2b-admission]
    paths: ['.github/workflows/r2b-native-logind-readonly.yml']
permissions:
  contents: read
jobs:
  original-gui-logind:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source-lock original GUI and read-only real session inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          bash qualification/r2b-integrate-02-r2-r3/restore-r3.sh "$RUNNER_TEMP/r2b-r3" | tee receipt/production-tree.txt
          test "$(git -C "$RUNNER_TEMP/r2b-r3" hash-object credential_handoff.py)" = 269bdc0b19d8a189496c7ca3b9369c158f85b0f6
          test "$(git -C "$RUNNER_TEMP/r2b-r3" write-tree)" = 89946baeef719d7369887cc7d89a8a4230c7180e
          test "$(git hash-object qualification/r2b-admission/native_readonly_harness.py)" = 87587d2a33250e915a8400786df7d2e3cef61cf3
          test "$(git hash-object qualification/r2b-admission/approval_ledger.py)" = 39cd2c1b06823f025655b2191bff45988ef2c858
          test "$(git hash-object qualification/r2b-admission/operator_session.py)" = a25c9c3f1f12ccf40367b8bff5b5fe29fd60a8ba
          mkdir "$RUNNER_TEMP/r2b-r3/r2b-admission"
          cp qualification/r2b-admission/{approval_ledger,operator_session}.py "$RUNNER_TEMP/r2b-r3/r2b-admission/"
          test "$(git -C "$RUNNER_TEMP/r2b-r3" write-tree)" = 89946baeef719d7369887cc7d89a8a4230c7180e
          git rev-parse HEAD | tee receipt/source-lock.txt
          cd "$RUNNER_TEMP/r2b-r3/dashboard"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Source-locked native attestor syntax and existing operator guard suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/r2b-r3/requirements.txt"
          export PYTHONPATH="$RUNNER_TEMP/r2b-r3:$GITHUB_WORKSPACE/qualification/r2b-integrate-02:$GITHUB_WORKSPACE/qualification/r2b-closeout-custody:$GITHUB_WORKSPACE/qualification/r2b-admission"
          python -m compileall -q qualification/r2b-admission
          python -m unittest discover -s qualification/r2b-admission -p 'test_*.py' -v 2>&1 | tee receipt/new-source-tests.txt
      - name: Install offline Debian QEMU tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap debian-archive-keyring qemu-system-x86 qemu-utils e2fsprogs python3-pexpect imagemagick
      - name: Build real unchanged Debian 13 LightDM credential operator desktop
        shell: bash
        run: |
          set -euo pipefail
          sudo bash qualification/d2/build.sh "$RUNNER_TEMP/r2b-r3" "$RUNNER_TEMP/r2b-root" "$GITHUB_WORKSPACE/qualification/r2b-integrate-02-r2-r2/native" "$RUNNER_TEMP/r2b-vm"
          cp "$RUNNER_TEMP/r2b-vm/"{packages,dpkg-audit}.txt receipt/
      - name: Read-only logind PID mapping and revoked session refusal on real operator GUI
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 qualification/r2b-admission/native_readonly_harness.py "$RUNNER_TEMP/r2b-vm" "$GITHUB_WORKSPACE/receipt" | tee receipt/installed-logind.txt
          for marker in R2B_NATIVE_ORIGINAL_GUI_LOGIND_PASS R2B_NATIVE_NON_GUI_SAME_UID_REFUSAL_PASS R2B_NATIVE_EXPIRED_PAM_SESSION_REFUSED_PASS R2B_NATIVE_READONLY_LOGIND_PASS; do
            grep -Fx "$marker" receipt/installed-logind.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2b-original-gui-readonly-logind-receipts
          path: receipt/
          retention-days: 5
