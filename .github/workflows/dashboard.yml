name: Consolidated dashboard browser acceptance
on:
  push:
    paths:
      - 'dashboard/**'
      - 'tradebot.py'
      - 'financial_goals.py'
      - 'financial_history.py'
      - 'reserve_preview.py'
      - 'reserve_graphical.py'
      - 'reserve_policy.py'
      - 'reserve_runtime.py'
      - 'tests/test_reserve_graphical.py'
      - 'tests/test_reserve_preview.py'
      - 'tests/test_financial_history.py'
      - 'goal_control.py'
      - 'goal_evidence.py'
      - 'tests/test_financial_goals.py'
      - 'tests/test_goal_control.py'
      - 'tests/test_goal_evidence.py'
      - 'tests/test_conservative_goals.py'
      - 'tests/test_dashboard.py'
      - 'scripts/test_dashboard_browser.py'
      - '.github/workflows/dashboard.yml'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt playwright==1.57.0
      - run: npm --prefix dashboard ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix dashboard run build
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: python scripts/test_dashboard_browser.py
      - name: Install native graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth tk
          python -c 'import tkinter; print(tkinter.TkVersion)'
      - name: Qualify separate native reserve approval window
        run: xvfb-run -a python -m unittest discover -s tests -p test_reserve_graphical.py -v
