name: Native paper engine acceptance
on:
  push:
    paths:
      - 'engine.py'
      - 'paper_execution.py'
      - 'paper_supervisor.py'
      - 'paper_custody.py'
      - 'paper_provision.py'
      - 'paper_recovery.py'
      - 'paper_monitor.py'
      - 'tests/test_paper_provision.py'
      - 'scripts/run_paper_worker.py'
      - 'deploy/maj-vaj-paper-protection@.service'
      - 'financial_ledger.py'
      - 'financial_goals.py'
      - 'goal_control.py'
      - 'goal_evidence.py'
      - 'tests/test_goal_evidence.py'
      - 'tests/test_conservative_goals.py'
      - 'risk_gate.py'
      - 'reserve_policy.py'
      - 'reserve_runtime.py'
      - 'reserve_graphical.py'
      - 'reserve_authority.py'
      - 'reserve_preview.py'
      - 'tests/test_reserve_authority.py'
      - 'scripts/qualify_gate_native.py'
      - 'tradebot.py'
      - 'engine_strategies/**'
      - 'scripts/qualify_engine.py'
      - '.github/workflows/engine.yml'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Ensure private scratch ACL support
        run: command -v setfacl || (sudo apt-get update && sudo apt-get install -y acl)
      - run: python scripts/qualify_engine.py
