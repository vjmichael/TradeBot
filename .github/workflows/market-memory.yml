name: TB-04 native market memory and partition acceptance
on:
  push:
    paths:
      - 'market_memory.py'
      - 'market_lake.py'
      - 'scripts/manage_history.py'
      - 'scripts/qualify_market_lake.py'
      - 'tests/test_market_lake.py'
      - 'scripts/ingest_market.py'
      - 'scripts/qualify_market_memory.py'
      - 'tests/test_market_memory.py'
      - 'requirements-market.txt'
      - '.github/workflows/market-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-market-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-market.txt
      - run: python -c "import duckdb; assert duckdb.__version__ == '1.4.4'"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/qualify_market_memory.py
      - run: python scripts/qualify_market_lake.py
