name: TB-04 native market memory and partition acceptance
on:
  push:
    paths:
      - 'economic_memory.py'
      - 'tests/test_long_retention.py'
      - 'market_memory.py'
      - 'historical_readiness.py'
      - 'tests/test_historical_readiness.py'
      - 'market_directory.py'
      - 'tests/test_market_directory.py'
      - 'tests/test_dynamic_markets.py'
      - 'scripts/qualify_market_directory.py'
      - 'market_quality.py'
      - 'scripts/ingest_quality.py'
      - 'scripts/qualify_market_quality.py'
      - 'tests/test_market_quality.py'
      - 'market_lake.py'
      - 'scripts/manage_history.py'
      - 'scripts/qualify_market_lake.py'
      - 'tests/test_market_lake.py'
      - 'scripts/ingest_market.py'
      - 'scripts/qualify_market_memory.py'
      - 'tests/test_market_memory.py'
      - 'data_lifecycle.py'
      - 'data_preparation.py'
      - 'data_scheduler.py'
      - 'storage_management.py'
      - 'market_gap.py'
      - 'tests/test_data_operations.py'
      - 'deploy/maj-vaj-data.service'
      - 'scripts/qualify_data_service.py'
      - 'gap_schedule.py'
      - 'recovery_budget.py'
      - 'storage_telemetry.py'
      - 'tests/test_recovery_budget.py'
      - 'scripts/qualify_sustained_storage.py'
      - 'data_retention.py'
      - 'sample_archive.py'
      - 'recovery_rotation.py'
      - 'vintage_memory.py'
      - 'tests/test_archive_custody.py'
      - 'tests/test_vintage_memory.py'
      - 'scripts/schedule_data.py'
      - 'tests/test_data_scheduler.py'
      - 'scripts/prepare_data.py'
      - 'scripts/manage_data.py'
      - 'scripts/qualify_data_lifecycle.py'
      - 'tests/test_data_lifecycle.py'
      - 'tests/test_data_preparation.py'
      - 'requirements-market.txt'
      - '.github/workflows/market-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-market-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-market.txt
      - run: python -c "import duckdb; assert duckdb.__version__ == '1.4.4'"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/qualify_market_directory.py
      - run: python scripts/qualify_market_memory.py
      - run: python scripts/qualify_market_lake.py

      - run: python scripts/qualify_market_quality.py

      - run: python scripts/qualify_data_lifecycle.py
      - run: python scripts/qualify_data_service.py
      - run: python scripts/qualify_sustained_storage.py
