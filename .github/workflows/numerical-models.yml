name: TB-06B native FreqAI research-model acceptance
on:
  push:
    paths:
      - 'numerical_models.py'
      - 'numerical_features.py'
      - 'numerical_dataset.py'
      - 'scripts/manage_models.py'
      - 'scripts/qualify_model_host.py'
      - 'scripts/qualify_numerical_models.py'
      - 'scripts/qualify_numerical.py'
      - 'tests/test_numerical_models.py'
      - 'tests/test_model_worker.py'
      - 'engine.py'
      - '.github/workflows/numerical-models.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-freqai:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-market.txt
      - run: python -c "from engine import IMAGE,PLATFORM; import subprocess; subprocess.run(['docker','pull','--platform',PLATFORM,IMAGE],check=True,timeout=600)"
      - run: python -m unittest discover -s tests -p 'test_model_worker.py' -v
      - run: python scripts/qualify_model_host.py
