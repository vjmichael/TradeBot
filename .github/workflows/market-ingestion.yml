name: TB-04B historical and public streaming acceptance
on:
  push:
    paths:
      - 'market_archive.py'
      - 'market_stream.py'
      - 'market_gap.py'
      - 'market_memory.py'
      - 'scripts/ingest_market.py'
      - 'scripts/qualify_market_ingestion.py'
      - 'tests/test_market_ingestion.py'
      - 'requirements-market.txt'
      - '.github/workflows/market-ingestion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-ingestion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [archive, stream, bridge]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-market.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/qualify_market_ingestion.py ${{ matrix.mode }}
