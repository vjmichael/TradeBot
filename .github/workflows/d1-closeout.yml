name: D1 closeout exact-candidate installed browser qualification
on:
  push:
    branches: [qualification/tb-sec-key-01-r2a-r1-d1]
    paths: ['.github/workflows/d1-closeout.yml']
permissions:
  contents: read
jobs:
  exact-installed-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Restore exact candidate from preserved authenticated chain
        run: |
          mkdir -p receipt
          bash qualification/restore.sh "$RUNNER_TEMP/exact-candidate" | tee receipt/source-tree.txt
          test "$(git -C "$RUNNER_TEMP/exact-candidate" write-tree)" = a9cd0f3392a573d3c91cc2d8464c4b8de5eefb0b
      - name: Build unchanged lock
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/exact-candidate/dashboard"
          test "$(git hash-object package-lock.json)" = 2e72c5a32098c7d503b2bf0e35fac28b607a02d7
          npm ci --ignore-scripts --no-fund --no-audit --cache "$RUNNER_TEMP/d1-cache"
          rm -rf node_modules
          npm ci --offline --ignore-scripts --no-fund --no-audit --cache "$RUNNER_TEMP/d1-cache"
          npm run build
          test "$(git hash-object package-lock.json)" = 2e72c5a32098c7d503b2bf0e35fac28b607a02d7
      - name: Stage real independent systemd identities and synthetic vault
        run: |
          set -euo pipefail
          sudo bash qualification/install.sh "$RUNNER_TEMP/exact-candidate" "$(command -v python)" | tee receipt/installed.txt
          cd "$RUNNER_TEMP/exact-candidate"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/source-manifest"
          cd /opt/maj-vaj
          sha256sum -c "$RUNNER_TEMP/source-manifest" > "$GITHUB_WORKSPACE/receipt/deployed-hashes.txt"
      - name: Audit exact installed dashboard in real sandboxed Chrome
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.57.0
          chrome="$(command -v google-chrome || command -v chromium)"
          "$chrome" --version | tee receipt/browser-version.txt
          mkdir -m700 "$RUNNER_TEMP/maj-browser-fixture"
          timeout 180 python qualification/browser.py "$RUNNER_TEMP/exact-candidate" "$RUNNER_TEMP/maj-browser-fixture" "$chrome" | tee receipt/browser-audit.txt
      - name: Remove synthetic credential and stop services
        if: always()
        run: |
          if sudo systemctl is-active --quiet maj-vaj-paper-vault.service; then
            sudo runuser -u maj-vaj-credential-operator -- /opt/maj-vaj/venv/bin/python -I -B -c 'import sys;sys.path.insert(0,"/opt/maj-vaj");from paper_credential_vault import send;assert send({"op":"remove","slots":["grok"]})["ok"]'
          fi
          sudo systemctl stop maj-vaj-paper-dashboard.service maj-vaj-paper-dashboard-backend.service maj-vaj-dashboard-backend.socket maj-vaj-paper-vault.service || true
          sudo rm -f /etc/maj-vaj/paper-vault-enabled /etc/maj-vaj/paper-dashboard-qualification-enabled
      - name: Preserve only small qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-closeout-installed-browser-receipt
          path: receipt/
          retention-days: 3
  debian-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install and invoke native Debian browser without disabling sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap debian-archive-keyring
          root="$RUNNER_TEMP/d1-debian"
          sudo debootstrap --variant=minbase --keyring=/usr/share/keyrings/debian-archive-keyring.gpg trixie "$root" http://deb.debian.org/debian
          sudo chroot "$root" apt-get update
          sudo chroot "$root" env DEBIAN_FRONTEND=noninteractive apt-get -y --no-install-recommends install chromium chromium-sandbox xdg-utils
          sudo chroot "$root" dpkg-query -W chromium chromium-sandbox xdg-utils | tee receipt/debian-packages.txt
          sudo chroot "$root" dpkg --audit | tee receipt/debian-dpkg-audit.txt
          test ! -s receipt/debian-dpkg-audit.txt
          sudo mount -t proc proc "$root/proc"
          trap 'sudo umount "$root/proc" || true' EXIT
          sudo chroot "$root" chromium --version | tee receipt/debian-chromium-version.txt
          sudo chroot "$root" xdg-mime --version | tee receipt/debian-xdg-version.txt
      - name: Preserve tiny Debian receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-closeout-debian-package-receipt
          path: receipt/
          retention-days: 3
