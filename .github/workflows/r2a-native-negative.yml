name: R2A installed cancellation session-loss and recovery acceptance
on:
  push:
    branches: [qualification/tb-sec-key-01-r2a-native-negative]
    paths: ['.github/workflows/r2a-native-negative.yml']
permissions:
  contents: read
jobs:
  r2a-native-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source-lock exact R1 candidate and independent negative test inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          bash qualification/r2b-integrate-02-r2-r3/restore-r3.sh "$RUNNER_TEMP/r2b-r3" | tee receipt/source-tree.txt
          test "$(git -C "$RUNNER_TEMP/r2b-r3" hash-object credential_handoff.py)" = 269bdc0b19d8a189496c7ca3b9369c158f85b0f6
          test "$(git hash-object qualification/r2a-native-negative/harness.py)" = 0abf896eca0237cbbb0e64b8235526c3c3f22b5d
          test "$(git hash-object qualification/r2a-native-negative/test_handoff_refusals.py)" = d2fc1b43c6db299947f2aac999c86d6e230fd566
          git rev-parse HEAD | tee receipt/acceptance-commit.txt
          cd "$RUNNER_TEMP/r2b-r3/dashboard"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test "$(git hash-object package-lock.json)" = 2e72c5a32098c7d503b2bf0e35fac28b607a02d7
      - name: Exact-source guard and negative revocation unit qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/r2b-r3/requirements.txt"
          export PYTHONPATH="$RUNNER_TEMP/r2b-r3:$GITHUB_WORKSPACE/qualification/r2b-integrate-02-r2-r3/tests:$GITHUB_WORKSPACE/qualification/r2a-native-negative"
          python -m compileall -q "$RUNNER_TEMP/r2b-r3/credential_handoff.py" qualification/r2a-native-negative
          python -m unittest discover -s "$RUNNER_TEMP/r2b-r3/tests" -p test_credential_handoff.py -v 2>&1 | tee receipt/original-guard-tests.txt
          python -m unittest -v test_credential_intent test_handoff_refusals 2>&1 | tee receipt/negative-guard-tests.txt
      - name: Install native Debian 13 VM prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap debian-archive-keyring qemu-system-x86 qemu-utils e2fsprogs python3-pexpect imagemagick
      - name: Build exact-source installed Debian guest without network interface
        shell: bash
        run: |
          set -euo pipefail
          sudo bash qualification/d2/build.sh "$RUNNER_TEMP/r2b-r3" "$RUNNER_TEMP/r2b-root" "$GITHUB_WORKSPACE/qualification/r2b-integrate-02-r2-r2/native" "$RUNNER_TEMP/r2b-vm"
          cp "$RUNNER_TEMP/r2b-vm/"{packages,dpkg-audit}.txt receipt/
      - name: Actual Chromium native cancel, active-modal revocation and fresh PAM/vault recovery
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 qualification/r2a-native-negative/harness.py "$RUNNER_TEMP/r2b-vm" "$GITHUB_WORKSPACE/receipt" | tee receipt/native-negative.txt
          grep -Fx R2A_NATIVE_NEGATIVE_CANCEL_PASS receipt/native-negative.txt
          grep -Fx R2A_NATIVE_NEGATIVE_REVOKE_PASS receipt/native-negative.txt
          grep -Fx R2A_NATIVE_NEGATIVE_RECOVERY_PASS receipt/native-negative.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2a-native-negative-receipts
          path: receipt/
          retention-days: 5
